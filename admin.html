<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mehta Footwear Admin</title><style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#111827}.bar{background:#111827;color:white;padding:18px}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;padding:18px;border-radius:14px;border:1px solid #e5e7eb}.num{font-size:28px;font-weight:900}button,input,select{padding:10px;border:1px solid #ddd;border-radius:9px}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:12px}}</style></head><body><div class="bar"><b>MEHTA FOOTWEAR</b> — Admin Dashboard</div><div class="wrap"><section id="login"><h2>Admin login</h2><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button></section><section id="dash" hidden><div class="grid"><div class="card">Orders<div class="num" id="orders">—</div></div><div class="card">Products<div class="num" id="products">—</div></div><div class="card">Captured sales<div class="num" id="sales">—</div></div></div><h2>Orders</h2><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script>let token='';async function login(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok||d.user.role!=='ADMIN')return alert(d.error||'Admin access required');token=d.token;loginSec();load()}function loginSec(){document.getElementById('login').hidden=true;document.getElementById('dash').hidden=false}async function load(){const h={Authorization:'Bearer '+token};const a=await (await fetch('/api/admin/summary',{headers:h})).json();orders.textContent=a.orders;products.textContent=a.products;sales.textContent='₹'+a.sales.toLocaleString('en-IN');const os=await (await fetch('/api/admin/orders',{headers:h})).json();rows.innerHTML=os.map(o=>`<tr><td>${o.orderNumber}</td><td>${o.customerName}<br>${o.customerPhone}</td><td>₹${o.total}</td><td>${o.paymentStatus}</td><td><select onchange="status('${o.id}',this.value)">${['ORDER_PLACED','PAYMENT_CONFIRMED','PROCESSING','PACKED','SHIPPED','OUT_FOR_DELIVERY','DELIVERED','CANCELLED','RETURNED'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></td><td><button onclick="ship('${o.id}')">Create shipment</button></td></tr>`).join('')}async function status(id,v){await fetch('/api/admin/orders/'+id+'/status',{method:'PATCH',headers:{...{Authorization:'Bearer '+token},'content-type':'application/json'},body:JSON.stringify({status:v})})}async function ship(id){const r=await fetch('/api/admin/shipments/'+id+'/create',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();alert(r.ok?'Shipment created. AWB assignment can now be performed through Shiprocket.':d.error||'Shipment failed')}</script></body></html>
